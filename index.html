<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My RP Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">MYRP</div>

        <div class="nav-links">
            <a href="#">Dashboard</a>
            <a href="#">Servers</a>
            <a href="#">Staff</a>
            <a href="#">Profile</a>
        </div>
    </nav>

    <main>

        <section class="hero">
            <h1>Welcome back.</h1>
            <p>Manage your roleplay server from one place.</p>

            <button onclick="openDashboard()">
                Open Dashboard
            </button>
        </section>

        <section class="cards">

            <div class="card">
                <h2>124</h2>
                <p>Moderation Logs</p>
            </div>

            <div class="card">
                <h2>37</h2>
                <p>Staff Members</p>
            </div>

            <div class="card">
                <h2>1,284</h2>
                <p>Players</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
