<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patrly — Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="dashboard-page">

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">P</div>
        <span>Patrly</span>
    </div>

    <a href="/servers.html" class="back-button">
        ← Servers
    </a>

</header>

<main class="dashboard-container">

    <section class="page-heading">

        <p class="eyebrow">
            STAFF DASHBOARD
        </p>

        <h1 id="serverName">
            Loading...
        </h1>

        <p>
            Manage your staff activity.
        </p>

    </section>

    <section class="dashboard-grid">

        <div class="dashboard-card shift-card">

            <div class="card-icon">
                🕐
            </div>

            <h2>
                Staff Shift
            </h2>

            <p id="shiftStatus">
                You are currently off shift.
            </p>

            <button
                id="shiftButton"
                class="primary-button"
                onclick="toggleShift()"
            >
                Start Shift
            </button>

        </div>

        <div class="dashboard-card">

            <div class="card-icon">
                📝
            </div>

            <h2>
                Moderation Logs
            </h2>

            <p>
                View and create moderation records.
            </p>

            <button
                class="secondary-button"
                onclick="comingSoon()"
            >
                Coming Soon
            </button>

        </div>

        <div class="dashboard-card">

            <div class="card-icon">
                ⚙️
            </div>

            <h2>
                Server Settings
            </h2>

            <p>
                Configure your Patrly server settings.
            </p>

            <button
                class="secondary-button"
                onclick="comingSoon()"
            >
                Settings
            </button>

        </div>

    </section>

</main>

<script src="script.js"></script>

<script>
    loadDashboard();
</script>

</body>
</html>
